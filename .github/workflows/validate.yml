name: Validate Roamwise

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Validate destination and activity fixtures
        run: npm run validate:data
      - name: Audit live destination image URLs
        run: npm run audit:images
        continue-on-error: true
      - name: Build production app
        run: npm run build
